name: Build and deploy JTSA

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, package, and publish
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore JTSA.sln

      - name: Run tests
        run: dotnet test JTSA.sln --configuration Release --no-restore

      - name: Restore publish dependencies
        run: dotnet restore JTSA/JTSA.csproj --runtime win-x64

      - name: Set release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "JTSA/JTSA.csproj"
          $versionPrefix = $project.Project.PropertyGroup.VersionPrefix |
            Where-Object { $_ } |
            Select-Object -First 1

          if (-not $versionPrefix) {
            throw "VersionPrefix is not defined in JTSA/JTSA.csproj."
          }

          $version = "$versionPrefix.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish application
        run: >-
          dotnet publish JTSA/JTSA.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Version=${{ steps.version.outputs.version }}
          --no-restore

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 0.0.1298

      - name: Download previous release
        continue-on-error: true
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Package release
        run: >-
          vpk pack
          --packId JTSA
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe JTSA.exe
          --packTitle JTSA
          --releaseNotes .github/release-notes.md
          --exclude '(?i)(JTSA\.db$|(^|[\\/])Plugins[\\/])'
          --noPortable

      - name: Add legacy plugin migration to the single installer
        shell: pwsh
        run: |
          $installer = (Resolve-Path -LiteralPath 'Releases/JTSA-win-Setup.exe').Path
          dotnet publish installer/JTSA.SetupBootstrapper/JTSA.SetupBootstrapper.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output setup-bootstrapper `
            "-p:Version=${{ steps.version.outputs.version }}" `
            "-p:VelopackSetupPath=$installer"
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrapper publish failed.' }
          $wrapper = (Resolve-Path -LiteralPath 'setup-bootstrapper/JTSA-win-Setup.exe').Path
          Copy-Item -LiteralPath $wrapper -Destination $installer -Force

      - name: Publish GitHub release
        run: >-
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "JTSA ${{ steps.version.outputs.version }}"
          --tag "v${{ steps.version.outputs.version }}"
